server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tripai
    username: tripai
    password: tripai123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  scheduling:
    enabled: true

tripai:
  waha:
    url: http://localhost:3000
    api-key: tripai-local-key
    session: default
  travelpayouts:
    token: ${TRAVELPAYOUTS_TOKEN}
    base-url: https://api.travelpayouts.com
    marker: ${TRAVELPAYOUTS_MARKER:}   # marker de afiliado — deixe vazio em dev
  claude:
    api-key: ${CLAUDE_API_KEY}
    model: claude-haiku-4-5   # leve e barato para lookups simples; troque por claude-opus-4-7 se precisar de mais precisão
  scheduler:
    cron: "0 0 */6 * * *"   # a cada 6h; para testar use "0 */2 * * * *" (a cada 2 min)
  alert:
    min-drop-percentage: 15.0

management:
  endpoints:
    web:
      exposure:
        include: health,info
