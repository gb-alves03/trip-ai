services:
  postgres:
    image: postgres:15-alpine
    container_name: tripai-db
    environment:
      POSTGRES_USER: tripai
      POSTGRES_PASSWORD: tripai123
      POSTGRES_DB: tripai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripai"]
      interval: 10s
      timeout: 5s
      retries: 5

  waha:
    image: devlikeapro/waha
    platform: linux/amd64
    container_name: tripai-waha
    ports:
      - "3000:3000"
    environment:
      WHATSAPP_API_KEY: tripai-local-key
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_START_SESSION: default
      WHATSAPP_HOOK_URL: http://host.docker.internal:8081/webhook/waha
      WHATSAPP_HOOK_EVENTS: message
    volumes:
      - waha_sessions:/app/.sessions

volumes:
  postgres_data:
  waha_sessions:
